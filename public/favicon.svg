<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Monster green gradient: #38F93E → #00FF66 -->
    <linearGradient id="monster-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38F93E"/>
      <stop offset="100%" stop-color="#00FF66"/>
    </linearGradient>
  </defs>

  <!-- Diamond polygon centered at 16,16 -->
  <!-- Fast 1-second spin, then holds for 9 seconds, repeats every 10s -->
  <polygon points="16,2 30,16 16,30 2,16" fill="url(#monster-green)">
    <animateTransform
      attributeName="transform"
      type="rotate"
      values="0 16 16; 360 16 16; 360 16 16"
      keyTimes="0; 0.1; 1"
      dur="10s"
      repeatCount="indefinite"
    />
  </polygon>
</svg>
